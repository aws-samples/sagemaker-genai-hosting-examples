# Run master in-container as-is; keep pid/logs in writable paths and log to the container's stderr
# so CannotStartContainerError diagnostics show up in CloudWatch.
pid /tmp/nginx.pid;
error_log /dev/stderr info;
events {}
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  server {
    listen 8080;
    # SageMaker health check -> vLLM /health (503 until the engine is ready, then 200).
    location = /ping {
      proxy_pass http://127.0.0.1:8000/health;
    }
    # SageMaker invoke -> vLLM OpenAI chat-completions. Body (OpenAI messages) passes through unchanged.
    location = /invocations {
      proxy_pass http://127.0.0.1:8000/v1/chat/completions;
      proxy_buffering off;          # stream SSE chunks straight through (stream:true)
      proxy_read_timeout 900s;      # allow long generations
      proxy_http_version 1.1;
    }
  }
}
