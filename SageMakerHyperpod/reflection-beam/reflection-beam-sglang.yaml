apiVersion: inference.sagemaker.aws.amazon.com/v1
kind: InferenceEndpointConfig
metadata:
  name: reflection-beam-sglang
  namespace: "${BEAM_NAMESPACE}"
spec:
  modelName: Reflection-Beam-SGLang
  instanceType: "${SGLANG_INSTANCE_TYPE}"
  invocationEndpoint: v1/chat/completions
  replicas: 1
  loadBalancer:
    healthCheckPath: /health
    routingAlgorithm: least_outstanding_requests
  modelSourceConfig:
    modelSourceType: huggingface
    prefetchEnabled: false
    huggingFaceModel:
      modelId: "${SGLANG_MODEL_ID}"
      commitSHA: "${SGLANG_MODEL_COMMIT_SHA}"
  worker:
    image: "${SGLANG_IMAGE}"
    command:
      - sglang
      - serve
    args:
      - --model-path
      - /opt/ml/model
      - --served-model-name
      - reflection-beam
      - --tp-size
      - "${SGLANG_TENSOR_PARALLEL_SIZE}"
      - --ep-size
      - "${SGLANG_EXPERT_PARALLEL_SIZE}"
      - --reasoning-parser
      - "${SGLANG_REASONING_PARSER}"
      - --tool-call-parser
      - "${SGLANG_TOOL_CALL_PARSER}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    modelInvocationPort:
      containerPort: 8000
      name: http
    modelVolumeMount:
      mountPath: /opt/ml/model
      name: model-weights
    resources:
      limits:
        nvidia.com/gpu: "${SGLANG_GPU_COUNT}"
      requests:
        nvidia.com/gpu: "${SGLANG_GPU_COUNT}"
    probes:
      startupProbe:
        httpGet:
          path: /health
          port: http
        failureThreshold: 360
        periodSeconds: 10
        timeoutSeconds: 5
      readinessProbe:
        httpGet:
          path: /health
          port: http
        failureThreshold: 12
        periodSeconds: 10
        timeoutSeconds: 5
      livenessProbe:
        httpGet:
          path: /health
          port: http
        failureThreshold: 12
        periodSeconds: 30
        timeoutSeconds: 5
